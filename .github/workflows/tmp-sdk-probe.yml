name: tmp sdk probe
on:
  pull_request:
    branches: [master]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: List SDKs
        shell: pwsh
        run: |
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" | Select -Expand Name
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib" | Select -Expand Name
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -format json | Select -First 40
      - name: winget search
        shell: pwsh
        continue-on-error: true
        run: |
          winget --version
          winget search Microsoft.WindowsSDK --accept-source-agreements
          winget search "Windows Software Development Kit" --accept-source-agreements
      - name: choco search
        shell: pwsh
        continue-on-error: true
        run: choco search windows-sdk --all-versions --limit-output | Select -First 60
      - name: Try VS component 28000
        shell: pwsh
        continue-on-error: true
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Output "VS at $vs"
          foreach ($c in 'Microsoft.VisualStudio.Component.Windows11SDK.28000','Microsoft.VisualStudio.Component.Windows11SDK.27000') {
            Write-Output "== try $c"
            $p = Start-Process -FilePath "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe" -ArgumentList "modify --installPath `"$vs`" --add $c --quiet --norestart --noUpdateInstaller" -Wait -PassThru
            Write-Output "exit $($p.ExitCode)"
            Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" | Select -Expand Name
          }
